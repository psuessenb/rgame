# The Game/ cops ship in the gem, and this repository loads them the way a game
# does, so a broken plugin fails the lint here first. `bundle exec` puts lib/ on
# the load path through the Gemfile's `gemspec`.
plugins:
  - rubocop-rspec
  - rubocop-performance
  - rgame/rubocop:
      plugin_class_name: RuboCop::Game::Plugin

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0

# Per-frame allocation guards (the project's own cops, see lib/rgame/rubocop/cop/game/).
#
# - NoInterpolationInHotPath: no string interpolation in per-frame methods.
# - NoNeedlessAllocation: no needless Array/Range literals (receiver literals anywhere,
#   any literal inside a per-frame method).
# - DrawInLocalSpace: a node's draw methods must not read its own position, in
#   either space. Node2D#draw pushes the node's transform onto the renderer, so
#   both `x` and `world_x` are already applied by the time `on_draw` runs.
#
# Specs are test code (their `on_draw`/`update` stubs and array fixtures aren't a
# shipping per-frame path), so the two allocation guards don't police either suite.
# DrawInLocalSpace is not excluded: a spec that draws a node in the wrong place is
# describing a game that draws it in the wrong place too.
Game/NoInterpolationInHotPath:
  Exclude:
    - 'spec/**/*'
    - 'spec_core/**/*'
Game/NoNeedlessAllocation:
  Exclude:
    - 'spec/**/*'
    - 'spec_core/**/*'
# In a game, the hot path is its lifecycle hooks and what it tags. rgame's own
# runtime is what those hooks call into, and no method there can know whether a
# game calls it every frame, so every one of them counts. A block exit always
# has a free rewrite, which is what makes that affordable here and not for the
# other two guards, whose error messages and loaders would all be flagged.
Game/NoBlockExitInHotPath:
  EveryMethodIn:
    - 'lib/rgame/engine/**/*.rb'
    - 'lib/rgame/core/**/*.rb'
    - 'lib/rgame/util/**/*.rb'
    - 'lib/rgame/game.rb'
  Exclude:
    - 'spec/**/*'
    - 'spec_core/**/*'
# The engine layer must stay headless: it may never name RGame::Core, in lib or
# in its specs. Everything else is allowed to (Core's own code, its specs, the
# test-project driver), so the cop is scoped to where the rule applies rather
# than excluded from where it doesn't.
Game/NoCoreInEngineLayer:
  Enabled: true
  Include:
    - 'lib/rgame/engine/**/*.rb'
    - 'spec/**/*.rb'
  Exclude:
    - 'spec/rubocop/**/*.rb'

# The other direction. Engine sits on top of Core, so Core must not know it
# exists — and unlike its mirror nothing catches this at runtime, because
# loading Engine into a Core spec works fine. Only the glue class directly under
# RGame may name both layers, and it is not in either list.
Game/NoEngineInCoreLayer:
  Enabled: true
  Include:
    - 'lib/rgame/core/**/*.rb'
    - 'spec_core/**/*.rb'

# Text a player reads comes from a translation table. The examples are what a
# reader copies and lib/ is the engine, so the rule holds there; specs draw
# literals on purpose, and test projects are games that are not migrated.
Game/NoLiteralText:
  Include:
    - 'examples/**/*.rb'
    - 'lib/**/*.rb'

# The engine keeps every ivar of a node or component under `rgame_`, and the
# cop keeps a game off that prefix, so it cannot run where the prefix is the
# rule. Two specs write an engine ivar on purpose: one checks the reader macros
# against the ivar they keep, the other checks that the ivar spec passes one.
Game/NoEngineIvar:
  Exclude:
    - 'lib/rgame/engine/**/*.rb'
    - 'spec/rgame/engine/sealed_privates_spec.rb'
    - 'spec/rgame/engine/prefixed_ivars_spec.rb'

# tools/drive/ holds input scripts for the test-project driver: Ruby syntax, but
# data rather than source. Each is read and `instance_eval`'d by
# tools/drive_test_project.rb, never required — so a file-level
# `frozen_string_literal` magic comment in one is inert, and adding it would be
# cargo cult rather than a fix. The scripts are a flat sequence of DSL calls with no strings in them.
Style/FrozenStringLiteralComment:
  Exclude:
    - 'tools/drive/**/*.rb'

# This is a code-driven game engine, not a Rails app: update/draw methods and
# Window/Scene classes naturally run long, and short coordinate/loop variable
# names (x, y, dt, id) are idiomatic. Relax the size/naming cops accordingly.
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false

# Math-heavy engine/graphics code reads fine on standard operator precedence
# (row * cols + col, x + w / 2); requiring parens everywhere is just noise.
Lint/AmbiguousOperatorPrecedence:
  Enabled: false

# Every ivar of a node or component starts with `rgame_`, so a memo there is
# `@rgame_context` behind `context`, and this cop's rule and the engine's cannot
# both hold. The engine's wins: it keeps a game's ivars the game's own.
Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'lib/rgame/engine/**/*.rb'

# Swapping two values through a temporary reads worse but costs nothing; the
# `a, b = b, a` this cop asks for allocates an Array on every swap. It compiles to
# `newarray 2` + `expandarray` — for local variables exactly as for instance variables,
# so there is no spelling of it that avoids the cost — measured at 100,000 objects over
# 100,000 swaps against 1 for the temporary. A frame that allocates is a GC pause
# waiting to happen, so the tidier shape loses everywhere it would appear here.
Style/SwapValues:
  Enabled: false

# mkmf's API *is* globals: $CFLAGS, $INCFLAGS and $libs are how an extconf.rb tells
# mkmf how to build the extension. There is no non-global alternative, so this cop
# can't be satisfied in extconf.rb without breaking the build.
Style/GlobalVars:
  Exclude:
    - 'ext/**/extconf.rb'

RSpec/MultipleExpectations:
  Enabled: false
# Integration / setup-heavy specs in a game naturally run longer than 5 lines.
RSpec/ExampleLength:
  Enabled: false
# A few specs describe a scenario or a file rather than one class — the gemspec
# suite, for one. They say so with an inline disable rather than a path rule.
RSpec/DescribeClass:
  Enabled: true

# Spec paths mirror lib/ paths, and two of our names don't survive the cop's default
# snake_casing:
#
# - RGame -> the cop wants `r_game/`, but the directory is `rgame/` on purpose: a gem's
#   lib/ directory is named after the gem, not after a snake_case of its module. RSpec
#   itself is the precedent (module RSpec lives in lib/rspec/, not lib/r_spec/), as are
#   oauth2/OAuth2 and sqlite3/SQLite3. Renaming the directory would change the public
#   require path (`require "rgame"`) and both C extensions' install paths for nothing.
# - Classes with a trailing dimension (Node2D, Scene2D) map to node2d_spec.rb, not the
#   cop's default node2_d_spec.rb.
RSpec/SpecFilePathFormat:
  CustomTransform:
    RGame: rgame
    Node2D: node2d

Style/Documentation:
  Enabled: false

# Grouping a small family of related classes in one file (e.g. a UI widget set)
# is intentional here; lib/ already follows one-class-per-file by convention.
Style/OneClassPerFile:
  Enabled: false

# The engine's i18n uses %{name} placeholders — the standard i18n / String#% template
# style — in translation strings. Accept template tokens over the default annotated
# %<name>s; the codebase uses no other %-format tokens.
Style/FormatStringToken:
  EnforcedStyle: template

# Every file under lib/rgame/core/ and lib/rgame/util/ reopens a class that a C
# extension already defined, and exists to document it and to add the odd Ruby
# convenience. A body with nothing in it is therefore the normal, finished state
# — it means C provides the whole class — not an oversight the cop should flag.
Lint/EmptyClass:
  Exclude:
    - 'lib/rgame/core/**/*.rb'
    - 'lib/rgame/util/**/*.rb'
