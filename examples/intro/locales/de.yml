# The German table. The story is longer than the English one and takes a page more.
de:
  intro:
    story: Vor langer Zeit, als die Straßen noch keine Namen hatten, lebte am Rand der Welt ein Laternenwärter. Jede Nacht stieg der Wärter auf den Turm und entzündete die Flamme, damit Reisende, die sich im Dunkeln verirrt hatten, den Weg nach Hause fanden. Niemand wusste mehr, wer sie zuerst entzündet hatte, und niemand dachte daran zu fragen. Dies ist die Geschichte der Nacht, in der die Flamme erlosch.
  hint:
    next: Enter blättert um
