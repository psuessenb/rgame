# The toolchain a job needs to build and test rgame on the runner's OS: system
# packages, the pinned Ruby with the bundle installed, and on Windows the UCRT64
# PATH fix and Mesa next to ruby.exe.
#
# It is one action rather than steps copied into each job, because the Windows
# half is a sequence where the order is load-bearing, and a second copy would
# drift from the first. Call it after actions/checkout, which is what makes a
# local action readable at all.
name: rgame toolchain
description: System packages, Ruby and OpenGL for building and testing rgame

inputs:
  system-sdl2:
    description: Install the system's SDL2. A job testing a static SDL2 leaves it out, so nothing can load it by accident.
    default: 'true'
  cmake:
    description: Install CMake, and Ninja on Windows, which `rake sdl2` needs.
    default: 'false'

runs:
  using: composite
  steps:
    # Linux needs SDL2 and OpenGL to build, Check to run the C suite, and
    # three things purely for `rake spec:core`:
    #
    #   xvfb           the display it starts for itself
    #   x11-utils      xwininfo, which HeadlessDisplay polls to know Xvfb is up
    #   libgl1-mesa-dri  llvmpipe. Xvfb has no GPU, and without a software
    #                    rasteriser SDL_GL_CreateContext fails and every Core
    #                    spec dies at App.new.
    #
    # libxtst6 is the XTEST runtime that spec_core/support/x_keys.rb dlopens
    # for synthetic keystrokes. It is a plain runtime library, not a -dev
    # package, because Fiddle opens it by soname rather than linking it.
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ${{ inputs.system-sdl2 == 'true' && 'libsdl2-dev' || '' }} \
          ${{ inputs.cmake == 'true' && 'cmake' || '' }} \
          libgl1-mesa-dev libgl1-mesa-dri \
          check pkg-config \
          xvfb x11-utils libxtst6 \
          gdb

    # `brew install sdl2` installs the **sdl2-compat** formula — SDL2's API
    # reimplemented on top of SDL3 — so on macOS the code behind an SDL2 call
    # lives in the `sdl3` dependency rather than in sdl2-compat itself. Worth
    # knowing before reading any SDL-level failure here.
    #
    # `brew update` first, so the SDL that gets installed is the current one
    # rather than whatever snapshot the runner image happens to carry; the
    # images can lag by several SDL releases. `brew list --versions` then
    # records what was actually installed, which is the first thing worth
    # knowing when a graphics or input failure appears on one run and not
    # another.
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew update
        brew install check pkg-config \
          ${{ inputs.system-sdl2 == 'true' && 'sdl2' || '' }} \
          ${{ inputs.cmake == 'true' && 'cmake' || '' }}
        brew list --versions sdl2-compat sdl3 check cmake || true

    # Derived from .ruby-version rather than written out here, so the pin has
    # one home. It cannot be handed to setup-ruby directly: the file is
    # written as `ruby 4.0.5`, which is not the bare version string that
    # action expects.
    - name: Read the pinned Ruby version
      id: ruby
      shell: bash
      run: echo "version=$(sed -E 's/^ruby[ -]//' .ruby-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ steps.ruby.outputs.version }}
        bundler-cache: true

    # RubyInstaller ships MSYS2; `ridk exec` runs a command inside its mingw
    # environment, where pacman and the native toolchain live.
    #
    # **This must come after setup-ruby.** `ridk` belongs to a Ruby
    # installation and the Windows runner image ships one preinstalled, so
    # running this earlier resolves `ridk` against *that* Ruby and configures
    # *its* MSYS2 — not the one the build then uses. Ordering it here makes
    # the question moot: the only Ruby on PATH is the one we test with.
    #
    # `pkgconf` and `gcc` are listed even though something usually provides
    # them, because "the toolchain on PATH is the ucrt64 one" is exactly the
    # assumption that does not hold by default here. `--needed` makes an
    # already-installed package a no-op, so listing them costs nothing.
    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $packages = @(
          'mingw-w64-ucrt-x86_64-check',
          'mingw-w64-ucrt-x86_64-pkgconf',
          'mingw-w64-ucrt-x86_64-gcc',
          'mingw-w64-ucrt-x86_64-gdb'
        )
        if ('${{ inputs.system-sdl2 }}' -eq 'true') { $packages += 'mingw-w64-ucrt-x86_64-SDL2' }
        if ('${{ inputs.cmake }}' -eq 'true') { $packages += 'mingw-w64-ucrt-x86_64-cmake', 'mingw-w64-ucrt-x86_64-ninja' }
        ridk exec pacman --sync --noconfirm --needed @packages

    # MSYS2 is several environments in one installation, and the packages
    # above went into `ucrt64` — the one that builds *native* Windows
    # binaries, which is what RubyInstaller's Ruby can load.
    #
    # Without this the build does not run there. pacman succeeds, yet
    # pkg-config finds neither sdl2 nor check and the compile comes out as
    # `cc` — which under MSYS2 is `/usr/bin/cc`, the msys-runtime gcc
    # targeting a Cygwin-like ABI. Both symptoms are one cause: `/usr/bin`
    # ahead of (or instead of) `/ucrt64/bin` on PATH, so every tool resolves
    # to the wrong environment.
    #
    # Prepending `/ucrt64/bin` fixes both at once. It is prepended rather than
    # substituted because msys's own `make` (there is no `make` in ucrt64,
    # only `mingw32-make`) still has to be reachable — driving a native
    # compiler from msys make is the combination RubyInstaller itself uses.
    #
    # `cygpath -w` converts the MSYS path to the Windows form GITHUB_PATH
    # wants. The Makefile's `CC` needs no setting here: it forces `gcc`
    # itself, for the same reason this step exists.
    - name: Put the UCRT64 toolchain first on PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $bin = (ridk exec cygpath -w /ucrt64/bin | Select-Object -Last 1).Trim()
        if (-not $bin) { throw 'could not resolve /ucrt64/bin' }
        Write-Host "prepending $bin"
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    # `rake spec:core` opens real windows and needs real OpenGL, same as Linux
    # does above — but this runner has no GPU and, unlike Linux, Windows
    # installs no software rasteriser by default. What it falls back to is
    # `GDI Generic`, Microsoft's own OpenGL 1.1 implementation from the NT
    # era, which is not something this renderer can be expected to work
    # against. Mesa here is the direct equivalent of `libgl1-mesa-dri` on the
    # Linux leg.
    #
    # Mesa's Windows build ships as a drop-in `opengl32.dll`, and *where* it
    # lands is load-bearing: Windows' DLL search order checks the calling
    # process's own directory before System32, and PATH only *after*
    # System32 — so a copy anywhere on PATH would never be found ahead of the
    # System32 one it is meant to replace. It has to sit next to the
    # executable that actually opens the GL context, which here is `ruby.exe`.
    - name: Find Ruby's bin directory (Windows)
      if: runner.os == 'Windows'
      id: ruby_bin
      shell: pwsh
      run: |
        $bin = (Get-Command ruby).Source | Split-Path -Parent
        "dir=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Install Mesa software OpenGL next to ruby.exe (Windows)
      if: runner.os == 'Windows'
      uses: f3d-app/install-mesa-windows-action@1824e370ed7fb1795f5bc88fd1f6c81eb15d92bc # v1
      with:
        path: ${{ steps.ruby_bin.outputs.dir }}
