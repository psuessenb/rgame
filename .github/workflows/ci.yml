# CI — the verification tiers, on the three supported platforms.
#
# Each platform fails in ways that are invisible on the others: a header search
# path, a DLEXT, a dlopen soname, a buffer-swap semantic that only differs on a
# real GPU. Running all three on every push is what keeps those from being
# discovered by a user instead.
#
# The tiers run in the order CLAUDE.md lists them, cheapest and most
# deterministic first, so a failure lands on the smallest thing that could have
# caused it:
#
#   make test          Check suite: pure logic + fake backends. No display.
#   make               the standalone binary — the other driver of the C API,
#                      and the only tier that compiles src/main.c at all.
#   make ext           both extensions, into lib/rgame/.
#   rake spec          headless: Util + Engine + packaging. No SDL in-process.
#   rake spec:core     Core: opens real windows, boots its own Xvfb on Linux.
#   rake docs:coverage every public name docs/api leaves undocumented; Linux only.
#
# `rake` with no argument runs the three test tasks, but it does not build the
# extensions — `make ext` is their prerequisite (CLAUDE.md, "Build"), so the
# steps are spelled out rather than collapsed into one `rake`.
#
# ## Actions are pinned to a commit, with the version in the comment
#
# A tag is a movable pointer: whoever owns the action repository can repoint
# `v4` at anything, and every workflow that names it runs the new code on its
# next push. That is a supply-chain hole for any job holding credentials, which
# the release job below does — so the SHA is what is written, and the comment
# says which release it was, because a bare SHA cannot be read.
#
# The cost is that pinned actions do not update themselves. To bump one:
#
#   git ls-remote --tags --heads https://github.com/<owner>/<action>
#
# and take the `refs/tags/<version>^{}` line for an annotated tag — that is the
# commit; the other line is the tag object, which Actions will not accept.
# Dependabot can do this for you: it understands `@<sha> # <version>` and opens
# a PR that rewrites both halves together.
#
# Note also that an unresolvable `uses:` fails the job at *setup*, before any
# step runs, so an `if:` on the step does not protect against a bad ref.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # `ported` marks a platform as one this project actually supports, and it
    # gates whether that leg is a *gate* or a *measurement*.
    #
    # A platform being brought up is expected to fail, and must not gate
    # anything: with `ported: false` it shows red on the job while the run stays
    # green, so every supported platform keeps working as the regression guard
    # it is. Without it there would be no way to tell "not ported yet, as
    # expected" from "somebody broke a working platform".
    #
    # The flip side is that a *working* platform left marked unported rots
    # silently, because nothing would report it breaking again. So the flag is
    # set true as soon as a leg is green, which is why all three are true today.
    continue-on-error: ${{ !matrix.ported }}

    strategy:
      # One platform's failure must not cancel the others: on a matrix this
      # small, the whole point is seeing all three answers from one push.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ported: true
          # `macos-latest` rather than a version pin, deliberately: "does this
          # work on the Mac people actually have" is the useful question for a
          # gem, and a pinned image drifts years behind that. The accepted
          # tradeoff is that a moving label can change underneath the build —
          # which is a thing CI is well placed to notice.
          - name: macos
            os: macos-latest
            ported: true
          - name: windows
            os: windows-latest
            ported: true

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # System packages, Ruby and the bundle, and on Windows the UCRT64 PATH fix
      # and Mesa. The order within it is load-bearing; see its comments.
      - name: Toolchain
        uses: ./.github/actions/toolchain

      # A leg marked `ported: false` runs every step even after one fails, so a
      # single push reports all the tiers instead of only the first thing to
      # break. A ported leg keeps ordinary stop-at-first-failure semantics,
      # because there it is a gate rather than a measurement.
      - name: C unit tests (Check)
        id: c_tests
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: make test

      # A Check failure that is a *segfault* says only "signal 11" and a line
      # number, which is where the C suite stops being useful on a platform
      # nobody can attach a debugger to by hand. So a crash gets a backtrace
      # automatically, and only when there was one.
      #
      # `CK_FORK=no` matters: Check normally runs each test in its own forked
      # child, and a debugger follows the *parent*, so the crash it reports is
      # in a process that did not crash. Running in-process gives the real
      # stack — at the cost of stopping at the first crash, which is what a
      # backtrace wants anyway.
      #
      # Windows has no usable fork, so its suite already dies on the first
      # segfault; there this step is the only way to learn which test that was.
      #
      # `always()` is load-bearing, not decoration: an `if:` with no explicit
      # status-check function gets an implicit `success()` prepended by GitHub
      # Actions, which can never be true at the same time as
      # `outcome == 'failure'`. Without it this step silently never runs.
      - name: Backtrace the C suite crash
        if: always() && steps.c_tests.outcome == 'failure'
        shell: bash
        run: |
          set -x
          case "${{ runner.os }}" in
            macOS)
              CK_FORK=no lldb --batch -o run -o 'bt all' -- ./build/test_rgame || true
              # `CK_FORK=no` is not sufficient on macOS, because some crashes
              # here only happen in a forked child — Apple's frameworks refuse
              # work in a child that has forked without exec, so running
              # in-process makes exactly that class of crash disappear and the
              # debugger reports a clean pass. macOS writes a full per-process
              # crash report for a forked child that dies, so for those the
              # report is the honest source rather than the debugger. Re-run
              # with fork left on to produce them, then print whatever landed.
              CK_FORK=yes ./build/test_rgame || true
              for dir in "$HOME/Library/Logs/DiagnosticReports" \
                         /Library/Logs/DiagnosticReports; do
                [ -d "$dir" ] || continue
                find "$dir" -name 'test_rgame*' -maxdepth 1 -print | while read -r f; do
                  echo "===== $f ====="
                  cat "$f"
                done
              done
              ;;
            Windows|Linux)
              CK_FORK=no gdb -batch -ex run -ex 'bt full' -ex 'info threads' \
                --args ./build/test_rgame || true
              ;;
          esac

      - name: Standalone binary
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: make

      - name: Build both extensions
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: make ext

      - name: Headless specs (Util + Engine + packaging)
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: bundle exec rake spec

      - name: Core specs (real windows)
        id: core_specs
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: bundle exec rake spec:core

      # The coverage spec inside `rake spec:core` already fails on a gap, but it
      # reports one JSON array. This prints the gaps grouped by class, and fails
      # the same way. The documentation is the same on every platform, so one
      # leg runs it.
      - name: Documentation coverage
        if: runner.os == 'Linux'
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: bundle exec rake docs:coverage

      # A native crash inside the Ruby process (unlike the C suite's own binary)
      # leaves nothing behind but "Process completed with exit code 1" — no
      # backtrace, not even which spec was running. `gdb --args` around the same
      # specs catches it the way the C suite's crash is caught above.
      #
      # Run directly rather than through `bundle exec` or `rake`: each of those
      # spawns Windows as a *new* process rather than POSIX-`exec`ing over the
      # current one, which would leave the debugger attached to the wrong
      # process. `bundle exec` in front of `gdb` itself is what still gets
      # bundler's load path into the `ruby` that gdb launches as its child.
      #
      # `always()` for the same reason as the C suite's backtrace step above.
      - name: Backtrace the Core specs crash (Windows)
        if: always() && runner.os == 'Windows' && steps.core_specs.outcome == 'failure'
        shell: bash
        run: |
          set -x
          bundle exec gdb -batch -ex run -ex 'bt full' -ex 'info threads' --args \
            ruby -e "require 'rspec/core'; exit RSpec::Core::Runner.run(['--pattern', 'spec_core/**/*_spec.rb', '--options', '.rspec-core'])" \
            || true

  # The platform gems' build: SDL2 from the pinned release, linked statically
  # into core_ext, on each of the three platforms. It runs `rake spec:core`
  # against that build, then tools/check_linkage.rb, which fails if core_ext
  # still depends on or exports SDL, or util_ext depends on a graphics library.
  #
  # The runner gets no system SDL2, so a build that still needed one could not
  # quietly load it.
  #
  # Linux builds inside rake-compiler-dock's x86_64-linux-gnu image rather than
  # on the runner. Its cross Ruby links no libruby, and its Ubuntu 20.04 glibc
  # gives a binary that needs GLIBC_2.29, where one built on ubuntu-latest needs
  # 2.38 and does not load on Ubuntu 22.04. The image has no display, so the
  # specs run on the runner against what the image built. The image is pinned by
  # digest, for the same reason the actions are pinned by commit.
  static-sdl2:
    name: static-sdl2 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    env:
      RCD_IMAGE: ghcr.io/rake-compiler/rake-compiler-dock-image:1.12.0-mri-x86_64-linux-gnu@sha256:2f7eabb005362054f71343bce19534a9c6f9d1ed085c66d773bb8fb67935703c

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Runs as root inside the image, which is what apt-get needs, and hands
      # the files it wrote back to the runner's user on the way out.
      #
      # SDL needs the X11 and Wayland headers at build time even though it
      # dlopens both at runtime. The image's RUBY_CC_VERSION lists every cross
      # Ruby it carries; the build takes the one matching .ruby-version's minor,
      # since more than one would give each its own lib/ subdirectory.
      - name: Build SDL2 and both extensions in the rake-compiler-dock image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --volume "$PWD:/rgame" --workdir /rgame \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            "$RCD_IMAGE" bash -c '
              set -euo pipefail
              trap "chown -R \"$HOST_UID:$HOST_GID\" /rgame" EXIT
              apt-get update
              apt-get install -y --no-install-recommends \
                libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
                libxss-dev libxinerama-dev libxfixes-dev libxkbcommon-dev \
                libwayland-dev wayland-protocols libegl-dev libgl-dev libgles-dev \
                libdrm-dev libgbm-dev libdbus-1-dev libudev-dev
              ln -sfn /usr/local/rake-compiler /root/.rake-compiler
              minor=$(sed -E "s/^ruby[ -]//; s/\.[0-9]+[[:space:]]*$//" .ruby-version)
              RUBY_CC_VERSION=$(tr : "\n" <<<"$RUBY_CC_VERSION" | grep -m1 "^$minor\.")
              export RUBY_CC_VERSION
              echo "cross-compiling for Ruby $RUBY_CC_VERSION"
              rake -f tools/cross_compile.rake sdl2 compile:x86_64-linux-gnu
            '

      - name: Toolchain
        uses: ./.github/actions/toolchain
        with:
          system-sdl2: 'false'
          cmake: ${{ runner.os != 'Linux' }}

      - name: Put the image's extensions in lib/rgame (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp tmp/x86_64-linux-gnu/stage/lib/rgame/core_ext.so tmp/x86_64-linux-gnu/stage/lib/rgame/util_ext.so lib/rgame/
          for so in lib/rgame/*.so; do
            echo "$so needs $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done

      - name: Build SDL2 (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: bundle exec rake sdl2

      - name: Build both extensions against it (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: make ext SDL2_STATIC=build/sdl2

      - name: Linkage
        shell: bash
        run: ruby tools/check_linkage.rb

      - name: Core specs (real windows)
        shell: bash
        run: bundle exec rake spec:core

  # Publish to RubyGems when lib/rgame/version.rb names a version that is not
  # on RubyGems yet.
  #
  # ## Why the version file and not a tag
  #
  # A release is "bump the version, merge to main". That keeps the version the
  # gem reports, the version the tag names and the version on RubyGems derived
  # from one file, instead of from a tag someone has to remember to push with
  # the matching content.
  #
  # ## Why a check and not a `paths:` filter
  #
  # `on: push: paths: [lib/rgame/version.rb]` looks like the obvious trigger and
  # is the wrong one: it fires on the *push that changed the file*, so a publish
  # that fails for an unrelated reason (RubyGems down, a flaky network) can only
  # be retried by touching that file again. Asking RubyGems what exists makes
  # this job idempotent instead — it runs on every push to main, does nothing
  # when the version is already published, and picks the release back up on the
  # next push if one ever fails halfway.
  #
  # ## Why `needs: test`
  #
  # Nothing is published unless all three platforms are green. Note this gate is
  # only as strong as `ported`: a leg marked `ported: false` reports success at
  # the job level (that is what continue-on-error does), so it would stop gating
  # this. That is the right behaviour for a platform being brought up, but it is
  # worth knowing it is the same flag.
  #
  # ## Credentials
  #
  # None stored. RubyGems trusted publishing exchanges GitHub's OIDC token for a
  # short-lived credential, which is also what makes this work at all given
  # `rubygems_mfa_required` in the gemspec — an API key would need an OTP that
  # CI cannot produce. The trust is registered on rubygems.org against this
  # repository *and this workflow filename*, so renaming this file breaks
  # publishing until the trusted publisher is updated to match.
  release:
    name: release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # One platform is enough: the gem ships source, not binaries, so the .gem
    # this builds is platform-agnostic and `gem install` compiles it on the
    # machine it lands on. The three-platform matrix above is what proves it
    # compiles there; this job only packages what it already checked out.
    runs-on: ubuntu-latest

    permissions:
      id-token: write # mint the OIDC token trusted publishing exchanges
      contents: write # push the tag and create the GitHub release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read the pinned Ruby version
        id: ruby
        run: echo "version=$(sed -E 's/^ruby[ -]//' .ruby-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}

      # `ruby -Ilib` rather than parsing the file: version.rb is the gemspec's
      # own source for this, so reading it the same way cannot disagree with
      # what gets built. It requires nothing compiled, by design.
      - name: Is this version already published?
        id: check
        run: |
          set -euo pipefail
          version=$(ruby -Ilib -e 'require "rgame/version"; print RGame::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ruby -rjson -rnet/http -e '
            version = ARGV[0]
            response = Net::HTTP.get_response(URI("https://rubygems.org/api/v1/versions/rgame.json"))
            published =
              case response
              when Net::HTTPSuccess then JSON.parse(response.body).map { _1["number"] }
              when Net::HTTPNotFound then [] # the gem has never been published
              # Anything else is unknown, not "no". Guessing here would mean a
              # RubyGems hiccup decides whether a release happens.
              else abort "RubyGems answered #{response.code} — refusing to guess"
              end
            publish = !published.include?(version)
            warn(publish ? "rgame #{version} is not on RubyGems — releasing." \
                         : "rgame #{version} is already on RubyGems — nothing to do.")
            puts "publish=#{publish}"
          ' "$version" >> "$GITHUB_OUTPUT"

      # The changelog gates the release, and does so *before* the gem is pushed:
      # a version with no section in CHANGELOG.md is a version somebody bumped
      # without saying what changed, and the failure has to land while that is
      # still fixable. After `gem push` it would not be — RubyGems does not take
      # a version back.
      #
      # The section is also the GitHub release body, so the two cannot drift.
      - name: Extract the release notes
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          awk -v v="${{ steps.check.outputs.version }}" '
            $0 ~ "^## \\[?" v "\\]?"  { found = 1; next }
            found && /^## /             { exit }        # the next version
            found && /^\[[^]]+\]: /     { exit }        # the link-reference footer
            found                       { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG.md has no section for ${{ steps.check.outputs.version }}." >&2
            echo "Add one before releasing." >&2
            exit 1
          fi
          cat release_notes.md

      # Pinned to an exact version because this action publishes **no moving
      # major tag**: its refs are v1.0.0, v2.0.0, v2.1.0 and nothing else, so
      # the `@v2` most actions accept does not resolve here.
      #
      # Worth knowing when this breaks: an unresolvable `uses:` fails the whole
      # job at setup, *before* any step runs — the `if:` below does not protect
      # against it, because Actions downloads every action in the job up front.
      #
      # No inputs: `trusted-publisher` defaults to true when nothing else is
      # configured, which is exactly this case.
      - name: Configure RubyGems credentials
        if: steps.check.outputs.publish == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # `gem build` rather than `rake build`: it needs no bundle and no dev
      # dependencies, and the gemspec deliberately loads nothing but version.rb.
      - name: Build and push the gem
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gem build rgame.gemspec
          gem push "rgame-${{ steps.check.outputs.version }}.gem"

      # Tag and release after the push, so a failed `gem push` does not leave a
      # tag claiming a version that was never published. Creating the tag is
      # skipped when it already exists, which is what makes a local
      # `rake release` and this job able to coexist.
      #
      # The release body is the changelog section extracted above.
      - name: Tag and release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release_notes.md
