# CI — the verification tiers, on the three supported platforms.
#
# Each platform fails in ways that are invisible on the others: a header search
# path, a DLEXT, a dlopen soname, a buffer-swap semantic that only differs on a
# real GPU. Running all three on every pull request and every push to main is
# what keeps those from being discovered by a user instead.
#
# The tiers run in the order CLAUDE.md lists them, cheapest and most
# deterministic first, so a failure lands on the smallest thing that could have
# caused it:
#
#   make test          Check suite: pure logic + fake backends. No display.
#   make               the standalone binary — the other driver of the C API,
#                      and the only tier that compiles src/main.c at all.
#   make ext           both extensions, into lib/rgame/.
#   rake spec          headless: Util + Engine + packaging. No SDL in-process.
#   rake spec:core     Core: opens real windows, boots its own Xvfb on Linux.
#   rake docs:coverage every public name docs/api leaves undocumented; Linux only.
#
# `rake` with no argument runs the three test tasks, but it does not build the
# extensions — `make ext` is their prerequisite (CLAUDE.md, "Build"), so the
# steps are spelled out rather than collapsed into one `rake`.
#
# ## Actions are pinned to a commit, with the version in the comment
#
# A tag is a movable pointer: whoever owns the action repository can repoint
# `v4` at anything, and every workflow that names it runs the new code on its
# next push. That is a supply-chain hole for any job holding credentials, which
# the release job below does — so the SHA is what is written, and the comment
# says which release it was, because a bare SHA cannot be read.
#
# The cost is that pinned actions do not update themselves. To bump one:
#
#   git ls-remote --tags --heads https://github.com/<owner>/<action>
#
# and take the `refs/tags/<version>^{}` line for an annotated tag — that is the
# commit; the other line is the tag object, which Actions will not accept.
# Dependabot can do this for you: it understands `@<sha> # <version>` and opens
# a PR that rewrites both halves together.
#
# Note also that an unresolvable `uses:` fails the job at *setup*, before any
# step runs, so an `if:` on the step does not protect against a bad ref.
#
# ## What runs when
#
# A pull request runs `test` only: the tiers above, on all three platforms.
# `build-gem`, `source-gem` and `smoke` run on main, where every merge lands
# anyway; running them on the branch as well built each merged change's gems
# twice and threw the first set away. `release` `needs:` all three, so a gem
# that fails to build or to play on main blocks the publish rather than
# shipping. `smoke` needs no `if:` of its own: it skips when `build-gem` does.
#
# `workflow_dispatch` is the way to see the gems before merging: run the
# workflow by hand on the branch (`gh workflow run CI --ref <branch>`) and it
# builds and smokes everything except the release.
#
# ## Every job that builds or tests has a time limit
#
# `timeout-minutes: 20` on `test`, `build-gem`, `source-gem` and `smoke`. The
# slowest of them takes about 6 minutes. Without a limit GitHub allows 6 hours,
# and a Windows `test` job once sat for 51 minutes on a child process that never
# exited. `spec_core/support/child_ruby.rb` puts a deadline on each child, so
# that case now fails in a minute; this limit covers whatever hangs next.
# `release` has none: it runs for seconds, and killing it halfway through
# publishing would leave some gems up and some not.
#
# A change confined to plans or to the agent skills runs nothing at all. None
# of it ships in the gem and no spec reads it, so there is nothing to verify.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/plans/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/plans/**'
      - '.claude/**'
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless — on
# every branch but `main`. A run there can be publishing, and a release is four
# `gem push` calls with a tag around them. Cancelling between two of them leaves
# a version half on RubyGems, which nothing can take back, so main's runs queue
# instead and the later one publishes whatever the earlier one did not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    # `ported` marks a platform as one this project actually supports, and it
    # gates whether that leg is a *gate* or a *measurement*.
    #
    # A platform being brought up is expected to fail, and must not gate
    # anything: with `ported: false` it shows red on the job while the run stays
    # green, so every supported platform keeps working as the regression guard
    # it is. Without it there would be no way to tell "not ported yet, as
    # expected" from "somebody broke a working platform".
    #
    # The flip side is that a *working* platform left marked unported rots
    # silently, because nothing would report it breaking again. So the flag is
    # set true as soon as a leg is green, which is why all three are true today.
    continue-on-error: ${{ !matrix.ported }}

    strategy:
      # One platform's failure must not cancel the others: on a matrix this
      # small, the whole point is seeing all three answers from one push.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            ported: true
          # `macos-latest` rather than a version pin, deliberately: "does this
          # work on the Mac people actually have" is the useful question for a
          # gem, and a pinned image drifts years behind that. The accepted
          # tradeoff is that a moving label can change underneath the build —
          # which is a thing CI is well placed to notice.
          - name: macos
            os: macos-latest
            ported: true
          - name: windows
            os: windows-latest
            ported: true

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # System packages, Ruby and the bundle, and on Windows the UCRT64 PATH fix
      # and Mesa. The order within it is load-bearing; see its comments.
      - name: Toolchain
        uses: ./.github/actions/toolchain

      # A leg marked `ported: false` runs every step even after one fails, so a
      # single push reports all the tiers instead of only the first thing to
      # break. A ported leg keeps ordinary stop-at-first-failure semantics,
      # because there it is a gate rather than a measurement.
      - name: C unit tests (Check)
        id: c_tests
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: make test

      # A Check failure that is a *segfault* says only "signal 11" and a line
      # number, which is where the C suite stops being useful on a platform
      # nobody can attach a debugger to by hand. So a crash gets a backtrace
      # automatically, and only when there was one.
      #
      # `CK_FORK=no` matters: Check normally runs each test in its own forked
      # child, and a debugger follows the *parent*, so the crash it reports is
      # in a process that did not crash. Running in-process gives the real
      # stack — at the cost of stopping at the first crash, which is what a
      # backtrace wants anyway.
      #
      # Windows has no usable fork, so its suite already dies on the first
      # segfault; there this step is the only way to learn which test that was.
      #
      # `always()` is load-bearing, not decoration: an `if:` with no explicit
      # status-check function gets an implicit `success()` prepended by GitHub
      # Actions, which can never be true at the same time as
      # `outcome == 'failure'`. Without it this step silently never runs.
      - name: Backtrace the C suite crash
        if: always() && steps.c_tests.outcome == 'failure'
        shell: bash
        run: |
          set -x
          case "${{ runner.os }}" in
            macOS)
              CK_FORK=no lldb --batch -o run -o 'bt all' -- ./build/test_rgame || true
              # `CK_FORK=no` is not sufficient on macOS, because some crashes
              # here only happen in a forked child — Apple's frameworks refuse
              # work in a child that has forked without exec, so running
              # in-process makes exactly that class of crash disappear and the
              # debugger reports a clean pass. macOS writes a full per-process
              # crash report for a forked child that dies, so for those the
              # report is the honest source rather than the debugger. Re-run
              # with fork left on to produce them, then print whatever landed.
              CK_FORK=yes ./build/test_rgame || true
              for dir in "$HOME/Library/Logs/DiagnosticReports" \
                         /Library/Logs/DiagnosticReports; do
                [ -d "$dir" ] || continue
                find "$dir" -name 'test_rgame*' -maxdepth 1 -print | while read -r f; do
                  echo "===== $f ====="
                  cat "$f"
                done
              done
              ;;
            Windows|Linux)
              CK_FORK=no gdb -batch -ex run -ex 'bt full' -ex 'info threads' \
                --args ./build/test_rgame || true
              ;;
          esac

      - name: Standalone binary
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: make

      - name: Build both extensions
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: make ext

      - name: Headless specs (Util + Engine + packaging)
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: bundle exec rake spec

      - name: Core specs (real windows)
        id: core_specs
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: bundle exec rake spec:core

      # The coverage spec inside `rake spec:core` already fails on a gap, but it
      # reports one JSON array. This prints the gaps grouped by class, and fails
      # the same way. The documentation is the same on every platform, so one
      # leg runs it.
      - name: Documentation coverage
        if: runner.os == 'Linux'
        continue-on-error: ${{ !matrix.ported }}
        shell: bash
        run: bundle exec rake docs:coverage

      # A native crash inside the Ruby process (unlike the C suite's own binary)
      # leaves nothing behind but "Process completed with exit code 1" — no
      # backtrace, not even which spec was running. `gdb --args` around the same
      # specs catches it the way the C suite's crash is caught above.
      #
      # Run directly rather than through `bundle exec` or `rake`: each of those
      # spawns Windows as a *new* process rather than POSIX-`exec`ing over the
      # current one, which would leave the debugger attached to the wrong
      # process. `bundle exec` in front of `gdb` itself is what still gets
      # bundler's load path into the `ruby` that gdb launches as its child.
      #
      # `always()` for the same reason as the C suite's backtrace step above.
      - name: Backtrace the Core specs crash (Windows)
        if: always() && runner.os == 'Windows' && steps.core_specs.outcome == 'failure'
        shell: bash
        run: |
          set -x
          bundle exec gdb -batch -ex run -ex 'bt full' -ex 'info threads' --args \
            ruby -e "require 'rspec/core'; exit RSpec::Core::Runner.run(['--pattern', 'spec_core/**/*_spec.rb', '--options', '.rspec-core'])" \
            || true

  # A platform gem per platform, built by tools/platform_gem.rake. SDL2 comes
  # from the pinned release, linked statically into core_ext, and the rakefile
  # runs tools/check_platform_gem.rb on the gem before it counts as built. The
  # checker fails a gem that ships build inputs, or binaries that depend on SDL
  # or libruby, or need a newer OS than the gem claims.
  #
  # `rake spec:core` then runs against the two binaries unpacked from the gem
  # file, so the Core suite tests what ships. The runner gets no system SDL2,
  # so a binary that still needed one could not quietly load it. The gem is
  # uploaded as an artifact, as the source gem is by the job below.
  #
  # Linux builds inside rake-compiler-dock's x86_64-linux-gnu image rather than
  # on the runner. Its cross Ruby links no libruby, and its Ubuntu 20.04 glibc
  # gives a binary that needs GLIBC_2.29, where one built on ubuntu-latest needs
  # 2.38 and does not load on Ubuntu 22.04. The image has no display, so the
  # specs run on the runner against what the image built. The image is pinned by
  # digest, for the same reason the actions are pinned by commit.
  build-gem:
    name: build-gem ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    env:
      RCD_IMAGE: ghcr.io/rake-compiler/rake-compiler-dock-image:1.12.0-mri-x86_64-linux-gnu@sha256:2f7eabb005362054f71343bce19534a9c6f9d1ed085c66d773bb8fb67935703c

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Runs as root inside the image, which is what apt-get needs, and hands
      # the files it wrote back to the runner's user on the way out.
      #
      # SDL needs the X11 and Wayland headers at build time even though it
      # dlopens both at runtime. The image's RUBY_CC_VERSION lists every cross
      # Ruby it carries; the build takes the one matching .ruby-version's minor,
      # since more than one would give each its own lib/ subdirectory. rbenv
      # would read .ruby-version too, whose `ruby 4.0.5` form it cannot parse,
      # so the rake that runs is pinned to the image's own Ruby.
      - name: Build and check the platform gem in the rake-compiler-dock image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --volume "$PWD:/rgame" --workdir /rgame \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            "$RCD_IMAGE" bash -c '
              set -euo pipefail
              trap "chown -R \"$HOST_UID:$HOST_GID\" /rgame" EXIT
              apt-get update
              apt-get install -y --no-install-recommends \
                libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
                libxss-dev libxinerama-dev libxfixes-dev libxkbcommon-dev \
                libwayland-dev wayland-protocols libegl-dev libgl-dev libgles-dev \
                libdrm-dev libgbm-dev libdbus-1-dev libudev-dev
              ln -sfn /usr/local/rake-compiler /root/.rake-compiler
              RBENV_VERSION=$(rbenv global)
              export RBENV_VERSION
              minor=$(sed -E "s/^ruby[ -]//; s/\.[0-9]+[[:space:]]*$//" .ruby-version)
              RUBY_CC_VERSION=$(tr : "\n" <<<"$RUBY_CC_VERSION" | grep -m1 "^$minor\.")
              export RUBY_CC_VERSION
              echo "cross-compiling for Ruby $RUBY_CC_VERSION"
              rake -f tools/platform_gem.rake platform_gem
            '

      - name: Toolchain
        uses: ./.github/actions/toolchain
        with:
          system-sdl2: 'false'
          cmake: ${{ runner.os != 'Linux' }}

      - name: Build and check the platform gem (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: bundle exec rake -f tools/platform_gem.rake platform_gem

      - name: Put the gem's binaries in lib/rgame
        shell: bash
        run: |
          gem unpack pkg/rgame-*.gem --target tmp/unpacked
          cp tmp/unpacked/rgame-*/lib/rgame/*_ext.* lib/rgame/

      - name: Core specs (real windows)
        shell: bash
        run: bundle exec rake spec:core

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{ matrix.name }}
          path: pkg/rgame-*.gem
          if-no-files-found: error

  # The source gem, built the way the release job builds it, so that a run
  # that builds gems yields every gem a release would publish.
  source-gem:
    name: source-gem
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read the pinned Ruby version
        id: ruby
        run: echo "version=$(sed -E 's/^ruby[ -]//' .ruby-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}

      - name: Build the source gem
        run: gem build rgame.gemspec

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-source
          path: rgame-*.gem
          if-no-files-found: error

  # Does a platform gem work on a machine that did not build it?
  #
  # build-gem checks what is *in* the gem. This installs it on a fresh runner
  # with no SDL2, no bundle and none of the build tools the toolchain action
  # normally puts down, and then plays two of the examples the gem itself
  # ships. Between them they cover what a user's first hour touches: the two
  # binaries, the shipped font, an image loaded through the asset manager, and
  # the `rgame` command.
  #
  # The runner still gets a display and an OpenGL implementation — Xvfb and Mesa
  # on Linux, Mesa beside ruby.exe on Windows. Every desktop has both; a runner
  # does not, and that is a property of CI rather than of the gem.
  #
  # What it cannot prove is the glibc floor, since the runner's glibc is newer
  # than the image's. tools/check_platform_gem.rb's rule 9 is what holds that.
  smoke:
    name: smoke ${{ matrix.name }}
    needs: build-gem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      # The harness, the input scripts and the checker are repository files, not
      # gem files. Only `rgame` itself comes from the artifact.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Toolchain
        uses: ./.github/actions/toolchain
        with:
          system-sdl2: 'false'
          build-tools: 'false'

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gem-${{ matrix.name }}
          path: pkg

      # The gem claims to need no SDL2. A runner that had one anyway would let a
      # gem that still depended on it pass, so the claim is only worth as much
      # as this step.
      - name: Refuse a runner that has an SDL2
        shell: bash
        run: |
          set -euo pipefail
          found=''
          case "${{ runner.os }}" in
            Linux)
              found=$(ldconfig -p | grep -i sdl || true) ;;
            macOS)
              found=$(brew list --formula | grep -iE '^sdl' || true)
              found="$found$(find /opt/homebrew/lib /usr/local/lib /usr/lib -maxdepth 1 -iname 'libSDL*' 2>/dev/null || true)" ;;
            Windows)
              # The directories Windows' loader searches for a DLL an extension
              # imports: the calling executable's own, System32, and the MSYS2
              # environments RubyInstaller adds.
              ruby_bin=$(dirname "$(command -v ruby)")
              found=$(find "$ruby_bin" /c/Windows/System32 /c/msys64/ucrt64/bin /c/msys64/mingw64/bin \
                        -maxdepth 1 -iname 'SDL*.dll' 2>/dev/null || true) ;;
          esac
          if [ -n "$found" ]; then
            echo "This runner has an SDL2, so the smoke test would prove nothing:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "No SDL2 on this runner."

      - name: Install the platform gem
        shell: bash
        run: gem install --local pkg/rgame-*.gem

      - name: Check what the install left
        shell: bash
        run: ruby tools/check_installed_gem.rb

      # Two examples, for two different halves of what ships. `collision` is
      # engine code drawing shapes and text, so it exercises both binaries and
      # the font under lib/rgame/fonts/. `sprite` loads a PNG through the asset
      # manager, so it exercises the image decoder and the data files under
      # examples/assets/ — which resolve against the *installed* directory, a
      # path nothing in a checkout ever takes.
      #
      # The script comes from the checkout, since the harness's default lookup
      # only knows projects inside it. `--installed` is what makes this a test
      # of the gem rather than of the checkout beside it, and the report's first
      # section says which it was.
      - name: Drive the installed gem's examples
        shell: bash
        run: |
          set -euo pipefail
          gem_dir=$(ruby -e 'require "rubygems"; print Gem::Specification.find_by_name("rgame").gem_dir')
          echo "driving examples from $gem_dir"
          for example in collision sprite; do
            ruby tools/drive_test_project.rb --installed \
              --script "tools/drive/examples/$example.rb" \
              "$gem_dir/examples/$example/main.rb" --ticks 120 | tee "$example.txt"
            grep -qF "$gem_dir" "$example.txt" || {
              echo "$example did not load rgame from $gem_dir" >&2
              exit 1
            }
          done

      - name: Generate a project with the installed rgame
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rgame new smoketest
          test -f smoketest/game.rb

  # Publish the four gems of the version lib/rgame/version.rb names: the three
  # platform gems build-gem uploaded, and the source gem from source-gem.
  #
  # ## It builds nothing
  #
  # Every gem it pushes was built and checked by the job that built it, and the
  # three platform gems were then installed and played on a clean runner by
  # smoke. Building them a second time here would publish a file nothing tested.
  #
  # tools/release_gems.rb decides which of the four RubyGems is missing, and
  # refuses a version that another commit released — see its comment. A push
  # that finds nothing missing is a no-op, which is the usual case.
  #
  # ## Why the version file and not a tag
  #
  # A release is "bump the version, merge to main". That keeps the version the
  # gem reports, the version the tag names and the version on RubyGems derived
  # from one file, instead of from a tag someone has to remember to push with
  # the matching content.
  #
  # ## Why a check and not a `paths:` filter
  #
  # `on: push: paths: [lib/rgame/version.rb]` looks like the obvious trigger and
  # is the wrong one: it fires on the *push that changed the file*, so a publish
  # that fails for an unrelated reason (RubyGems down, a flaky network) can only
  # be retried by touching that file again. Asking RubyGems what exists makes
  # this job idempotent instead — it runs on every push to main and does nothing
  # while the version's four gems are all there. A release that fails halfway is
  # finished by re-running it, which the tag below is what allows.
  #
  # ## Why `needs:` names every other job
  #
  # Nothing is published unless all three platforms are green, every gem built
  # and passed its checker, and every platform gem installed and drew on a
  # machine that did not build it. `needs:` is also what puts the artifacts in
  # this run's reach, since download-artifact reads the run it is part of.
  #
  # Note the `test` half of that gate is only as strong as `ported`: a leg
  # marked `ported: false` reports success at the job level (that is what
  # continue-on-error does), so it would stop gating this. That is the right
  # behaviour for a platform being brought up, but it is worth knowing it is the
  # same flag.
  #
  # ## Credentials
  #
  # None stored. RubyGems trusted publishing exchanges GitHub's OIDC token for a
  # short-lived credential, which is also what makes this work at all given
  # `rubygems_mfa_required` in the gemspec — an API key would need an OTP that
  # CI cannot produce. The trust is registered on rubygems.org against this
  # repository *and this workflow filename*, so renaming this file breaks
  # publishing until the trusted publisher is updated to match.
  release:
    name: release
    needs: [test, build-gem, source-gem, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # One platform is enough: it compiles nothing. The four gems arrive as
    # artifacts from the jobs that built them on their own platforms, and
    # `gem push` is the same call wherever it runs.
    runs-on: ubuntu-latest

    permissions:
      id-token: write # mint the OIDC token trusted publishing exchanges
      contents: write # push the tag and create the GitHub release

    steps:
      # The whole history, for its tags. tools/release_gems.rb reads the commit
      # vX.Y.Z names to tell a release it may finish from one it may not, and a
      # shallow checkout fetches no tags at all — every tag would read as absent.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Read the pinned Ruby version
        id: ruby
        run: echo "version=$(sed -E 's/^ruby[ -]//' .ruby-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}

      # All four gems into one directory. Their filenames carry the platform, so
      # nothing here has to know which artifact held which.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: gem-*
          merge-multiple: true
          path: pkg

      # `ruby -Ilib` rather than parsing the file: version.rb is the gemspec's
      # own source for this, so reading it the same way cannot disagree with
      # what gets built. It requires nothing compiled, by design.
      - name: Read the version
        id: version
        run: echo "version=$(ruby -Ilib -e 'require "rgame/version"; print RGame::VERSION')" >> "$GITHUB_OUTPUT"

      # The gems to push land in push_list.txt, in push order, and the reasoning
      # goes to the log either way. A directory that cannot be released — a
      # missing platform, a gem from another version — fails here, before any
      # credential exists.
      - name: Which of this version's gems are missing?
        id: plan
        run: |
          set -euo pipefail
          ruby tools/release_gems.rb pkg > push_list.txt
          echo "count=$(grep -c . push_list.txt || true)" >> "$GITHUB_OUTPUT"

      # The changelog gates the release, and does so *before* the gem is pushed:
      # a version with no section in CHANGELOG.md is a version somebody bumped
      # without saying what changed, and the failure has to land while that is
      # still fixable. After `gem push` it would not be — RubyGems does not take
      # a version back.
      #
      # The section is also the GitHub release body, so the two cannot drift.
      - name: Extract the release notes
        if: steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[?" v "\\]?"  { found = 1; next }
            found && /^## /             { exit }        # the next version
            found && /^\[[^]]+\]: /     { exit }        # the link-reference footer
            found                       { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}." >&2
            echo "Add one before releasing." >&2
            exit 1
          fi
          cat release_notes.md

      # Pinned to an exact version because this action publishes **no moving
      # major tag**: its refs are v1.0.0, v2.0.0, v2.1.0 and nothing else, so
      # the `@v2` most actions accept does not resolve here.
      #
      # Worth knowing when this breaks: an unresolvable `uses:` fails the whole
      # job at setup, *before* any step runs — the `if:` below does not protect
      # against it, because Actions downloads every action in the job up front.
      #
      # No inputs: `trusted-publisher` defaults to true when nothing else is
      # configured, which is exactly this case.
      - name: Configure RubyGems credentials
        if: steps.plan.outputs.count != '0'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # The tag goes up *before* the first push, which is the opposite of the
      # obvious order and the thing to understand about this job.
      #
      # A version is four pushes, so a run can die with two of them done. The
      # next run then has to answer whether those two are its to finish: if main
      # has moved on, the two gems still missing would carry code the two
      # published ones do not, under one version number. The tag is the only
      # record of which commit made them, so it has to exist before they do.
      #
      # The cost is a tag that can name a version no gem of which was published,
      # if the very first push fails. That is visible and fixable; the other way
      # round is not.
      - name: Tag the release
        if: steps.plan.outputs.count != '0'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" >/dev/null; then
            echo "v$VERSION already exists, at $(git rev-parse "refs/tags/v$VERSION^{commit}")"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      # Platform gems first, source gem last — tools/release_gems.rb put them in
      # that order. RubyGems indexes each push on its own, so a window where the
      # version resolves to source-only exists whatever the order; this is what
      # keeps it to seconds rather than to the whole release.
      - name: Push the gems
        if: steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          while read -r path; do
            echo "== gem push $path"
            gem push "$path"
          done < push_list.txt

      # Last, so a release never names a version RubyGems does not fully have.
      # A run finishing an earlier one finds the release already there, since
      # the tag it needed was pushed before any gem was.
      - name: Create the GitHub release
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --title "v$VERSION" --notes-file release_notes.md
